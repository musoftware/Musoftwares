<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Soft, ambient shadows for premium layered depth -->
    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="shadow-floating" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F6" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Glassmorphic card gradients -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Ambient glow backdrop (SaaS landing page style) -->
  <circle cx="400" cy="300" r="320" fill="url(#glowGrad)" opacity="0.5" />
  <circle cx="150" cy="150" r="180" fill="#EEF2F6" opacity="0.6" filter="blur(40px)" />
  <circle cx="650" cy="450" r="220" fill="#ED9DA0" opacity="0.1" filter="blur(60px)" />
  <circle cx="700" cy="150" r="150" fill="#818CF8" opacity="0.12" filter="blur(50px)" />

  <!-- Dotted operational flows representing connectivity of the unified workspace -->
  <path d="M 120,200 C 120,100 500,80 500,200" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,6" opacity="0.7" />
  <path d="M 335,280 C 335,380 600,430 600,320" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,6" opacity="0.7" />
  <path d="M 230,420 C 100,420 100,520 230,480" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,6" opacity="0.5" />

  <!-- Main Dashboard Window Frame -->
  <g filter="url(#shadow-main)">
    <rect x="50" y="80" width="700" height="460" rx="20" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect x="50" y="80" width="700" height="48" rx="20" fill="#F8FAFC" />
    <!-- Round off bottom corners of header so they don't leak -->
    <rect x="50" y="108" width="700" height="20" fill="#F8FAFC" />
    
    <!-- Window Controls -->
    <circle cx="82" cy="104" r="6" fill="#FF5F56" />
    <circle cx="102" cy="104" r="6" fill="#FFBD2E" />
    <circle cx="122" cy="104" r="6" fill="#27C93F" />
    
    <!-- Header Search Bar -->
    <rect x="160" y="92" width="220" height="24" rx="12" fill="#E2E8F0" opacity="0.5" />
    <circle cx="178" cy="104" r="4" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="181" y1="107" x2="186" y2="112" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <rect x="196" y="101" width="100" height="6" rx="3" fill="#94A3B8" opacity="0.7" />
    
    <!-- User Profile Bar -->
    <circle cx="682" cy="104" r="14" fill="#ED9DA0" />
    <rect x="704" y="98" width="24" height="6" rx="3" fill="#94A3B8" opacity="0.7" />
    <rect x="704" y="106" width="16" height="4" rx="2" fill="#CBD5E1" />
    
    <line x1="50" y1="128" x2="750" y2="128" stroke="#F1F5F9" stroke-width="1.5" />
    
    <!-- SIDEBAR (Width: 160px from x=50 to x=210) -->
    <!-- Active Nav State Pill -->
    <rect x="62" y="152" width="136" height="36" rx="10" fill="#F1F5F9" />
    
    <!-- Nav Items -->
    <!-- Item 1: Active Dashboard -->
    <rect x="76" y="164" width="12" height="12" rx="3.5" fill="#514E7F" />
    <rect x="98" y="167" width="65" height="6" rx="3" fill="#514E7F" />
    
    <!-- Item 2: Clients -->
    <circle cx="82" cy="216" r="6" fill="#94A3B8" />
    <rect x="98" y="213" width="55" height="6" rx="3" fill="#94A3B8" opacity="0.8" />
    
    <!-- Item 3: Financials -->
    <rect x="76" y="256" width="12" height="12" rx="3" fill="#94A3B8" />
    <rect x="98" y="259" width="60" height="6" rx="3" fill="#94A3B8" opacity="0.8" />
    
    <!-- Item 4: Operations -->
    <path d="M76,306 L88,306 L82,298 Z" fill="#94A3B8" />
    <rect x="98" y="301" width="50" height="6" rx="3" fill="#94A3B8" opacity="0.8" />
    
    <!-- Item 5: Settings -->
    <circle cx="82" cy="346" r="6" fill="#94A3B8" />
    <rect x="98" y="343" width="45" height="6" rx="3" fill="#94A3B8" opacity="0.8" />

    <!-- Sidebar Divider Line -->
    <line x1="210" y1="128" x2="210" y2="540" stroke="#F1F5F9" stroke-width="1.5" />
    
    <!-- MAIN CONTENT AREA (x=210 to x=750) -->
    <!-- Column 1: Financial & Operations (x=230 to x=465) -->
    
    <!-- Card 1.1: Financial Hub Ledger (Dark Card) -->
    <rect x="232" y="152" width="220" height="152" rx="16" fill="url(#walletGrad)" />
    
    <!-- Card Content -->
    <rect x="252" y="176" width="65" height="6" rx="3" fill="#94A3B8" opacity="0.4" />
    
    <!-- SVG Crisp Text for Balance -->
    <text x="252" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">$14,850.00</text>
    
    <!-- Growth Badge -->
    <rect x="372" y="170" width="60" height="18" rx="9" fill="#10B981" fill-opacity="0.15" />
    <circle cx="382" cy="179" r="3" fill="#34D399" />
    <text x="390" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#34D399">+12.5%</text>
    
    <!-- Sparkline Chart -->
    <path d="M 252,274 C 275,255 295,268 315,245 C 335,222 360,250 380,225 C 400,200 415,220 432,204" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Gradient Fill under chart -->
    <path d="M 252,274 C 275,255 295,268 315,245 C 335,222 360,250 380,225 C 400,200 415,220 432,204 L 432,284 L 252,284 Z" fill="url(#chartGrad)" />
    
    <!-- Card 1.2: Operations Timeline -->
    <rect x="232" y="324" width="220" height="192" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" />
    
    <text x="252" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A" letter-spacing="0.5">OPERATIONS</text>
    
    <!-- Milestone Row 1 (Complete) -->
    <circle cx="260" cy="386" r="8" fill="#10B981" />
    <path d="M 256.5,386 L 259,388.5 L 263.5,383.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="278" y="380" width="85" height="6" rx="3" fill="#334155" />
    <rect x="278" y="390" width="45" height="4" rx="2" fill="#94A3B8" opacity="0.6" />
    <rect x="390" y="377" width="42" height="16" rx="8" fill="#D1FAE5" />
    <text x="398" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#065F46">DONE</text>
    
    <!-- Connectors -->
    <line x1="260" y1="394" x2="260" y2="424" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="2,3" />
    
    <!-- Milestone Row 2 (Active Escrow) -->
    <circle cx="260" cy="432" r="8" fill="#6366F1" />
    <circle cx="260" cy="432" r="3.5" fill="#FFFFFF" />
    <rect x="278" y="426" width="95" height="6" rx="3" fill="#334155" />
    <rect x="278" y="436" width="60" height="4" rx="2" fill="#94A3B8" opacity="0.6" />
    <rect x="390" y="423" width="42" height="16" rx="8" fill="#EEF2F6" />
    <text x="396" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#514E7F">FLOW</text>
    
    <line x1="260" y1="440" x2="260" y2="470" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="2,3" />
    
    <!-- Milestone Row 3 (Pending Invoice) -->
    <circle cx="260" cy="478" r="8" fill="#F59E0B" />
    <path d="M 260,474.5 L 260,479 L 263.5,479" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <rect x="278" y="472" width="75" height="6" rx="3" fill="#334155" />
    <rect x="278" y="482" width="50" height="4" rx="2" fill="#94A3B8" opacity="0.6" />
    <rect x="390" y="469" width="42" height="16" rx="8" fill="#FEF3C7" />
    <text x="397" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#92400E">HOLD</text>

    <!-- Column 2: Client Directory (x=475 to x=728) -->
    <!-- Card 2: Unified Clients Directory -->
    <rect x="475" y="152" width="243" height="364" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" />
    
    <text x="495" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A" letter-spacing="0.5">CLIENT PORTALS</text>
    
    <!-- Search Bar Mock inside Clients Card -->
    <rect x="495" y="196" width="203" height="28" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="510" cy="210" r="4.5" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="513.5" y1="213.5" x2="518" y2="218" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <rect x="528" y="207" width="80" height="6" rx="3" fill="#94A3B8" opacity="0.6" />
    
    <!-- Client Item 1 -->
    <circle cx="515" cy="260" r="16" fill="#ED9DA0" />
    <text x="509" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">JD</text>
    <rect x="542" y="250" width="70" height="6" rx="3" fill="#1E293B" />
    <rect x="542" y="262" width="50" height="4" rx="2" fill="#94A3B8" opacity="0.7" />
    <rect x="644" y="251" width="54" height="18" rx="9" fill="#E0F2FE" />
    <text x="653" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#0369A1">ONLINE</text>
    
    <line x1="495" y1="290" x2="698" y2="290" stroke="#F1F5F9" stroke-width="1.2" />
    
    <!-- Client Item 2 -->
    <circle cx="515" cy="320" r="16" fill="#818CF8" />
    <text x="509" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">BS</text>
    <rect x="542" y="310" width="60" height="6" rx="3" fill="#1E293B" />
    <rect x="542" y="322" width="40" height="4" rx="2" fill="#94A3B8" opacity="0.7" />
    <rect x="644" y="311" width="54" height="18" rx="9" fill="#F1F5F9" />
    <text x="654" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#64748B">AWAY</text>
    
    <line x1="495" y1="350" x2="698" y2="350" stroke="#F1F5F9" stroke-width="1.2" />
    
    <!-- Client Item 3 -->
    <circle cx="515" cy="380" r="16" fill="#34D399" />
    <text x="509" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">WT</text>
    <rect x="542" y="370" width="80" height="6" rx="3" fill="#1E293B" />
    <rect x="542" y="382" width="55" height="4" rx="2" fill="#94A3B8" opacity="0.7" />
    <rect x="644" y="371" width="54" height="18" rx="9" fill="#E0F2FE" />
    <text x="653" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#0369A1">ONLINE</text>
    
    <line x1="495" y1="410" x2="698" y2="410" stroke="#F1F5F9" stroke-width="1.2" />
    
    <!-- Workspace Capacity Indicator -->
    <text x="495" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">CAPACITY UTILIZATION</text>
    
    <!-- Track -->
    <rect x="495" y="452" width="203" height="8" rx="4" fill="#F1F5F9" />
    <!-- Active Bar with Gradient -->
    <rect x="495" y="452" width="138" height="8" rx="4" fill="url(#accentGrad)" />
    
    <text x="495" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">4 Active Portals</text>
    <text x="668" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6366F1">68% max</text>
  </g>

  <!-- FLOATING GLASSMORPHIC CARDS (Layered on top of main window with heavy floating shadows) -->
  
  <!-- Floating Card 1: Escrow Protection Badge (Overlap bottom-left workspace navigation & operations) -->
  <g filter="url(#shadow-floating)">
    <rect x="110" y="430" width="180" height="64" rx="16" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Shield/Lock Icon container -->
    <rect x="126" y="446" width="32" height="32" rx="10" fill="#EEF2F6" />
    
    <!-- Shield/Lock SVG Icon -->
    <path d="M142,453 C145,453 147,455 147,458 L147,460 L149,460 C150.1,460 151,460.9 151,470 C151,471.1 150.1,472 149,472 L135,472 C133.9,472 133,471.1 133,470 L133,460 C133,458.9 133.9,460 135,460 L137,460 L137,458 C137,455 139,453 142,453 Z M142,455 C140.3,455 139,456.3 139,458 L139,460 L145,460 L145,458 C145,456.3 143.7,455 142,455 Z" fill="#514E7F" />
    
    <!-- Escrow Text details -->
    <text x="170" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Escrow Protected</text>
    <text x="170" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#10B981">$5,000.00 Held</text>
  </g>
  
  <!-- Floating Card 2: Premium Invoice Sent Badge (Overlap top-right workspace clients) -->
  <g filter="url(#shadow-floating)">
    <rect x="580" y="40" width="180" height="64" rx="16" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Circular Checkmark Badge -->
    <circle cx="612" cy="72" r="16" fill="#D1FAE5" />
    <!-- Crisp Checkmark -->
    <path d="M605.5,72 L609.5,76 L618.5,66.5" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Details -->
    <text x="640" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Invoice Settled</text>
    <text x="640" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" font-weight="500">Stark Labs — Instant</text>
  </g>

  <!-- Interactive Cursor element to make it feel "active" & human -->
  <g filter="url(#shadow-floating)">
    <!-- Sleek designer pointer cursor -->
    <path d="M 425,385 L 436,411 L 430,412.5 L 441,428.5 L 437,431 L 426,415 L 421.5,417 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="miter" />
  </g>
  
  <!-- Floating ambient geometric circles/particles for Memphis feel -->
  <circle cx="215" cy="115" r="4" fill="#6366F1" />
  <circle cx="460" cy="135" r="3.5" fill="#ED9DA0" />
  <circle cx="740" cy="220" r="5" fill="#34D399" />
  <circle cx="490" cy="510" r="4.5" fill="#F59E0B" />
  <circle cx="160" cy="520" r="6" fill="#818CF8" opacity="0.6" />
</svg>
