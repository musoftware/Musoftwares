<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Musoftware</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0f0f11;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem;
        }
        .icon {
            width: 64px; height: 64px;
            background: #1e1e24;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            border: 1px solid #2a2a35;
        }
        h1 { font-size: 1.5rem; font-weight: 600; color: #f1f5f9; }
        p  { font-size: 0.9rem; color: #64748b; text-align: center; max-width: 320px; line-height: 1.6; }
        .hint {
            background: #1e1e24;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            max-width: 360px;
        }
        .hint strong { color: #22c55e; }
        button {
            margin-top: 0.5rem;
            padding: 0.6rem 1.5rem;
            background: #1e1e24;
            border: 1px solid #2a2a35;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #2a2a35; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Can't reach Musoftware. Check your internet connection and try again.</p>
    <div class="hint">
        <strong>✓ Local agent still running</strong><br>
        Your tools are still executing locally. Once you reconnect, the UI will sync automatically.
    </div>
    <button onclick="location.reload()">Try again</button>
</body>
</html>
