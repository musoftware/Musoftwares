<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gld-base" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="80%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="gld-bevel" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="gld-ribbon" x1="0" y1="60" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="gld-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EAB308" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Red Laurels/Ribbon Tails -->
  <path d="M42,90 L34,114 L50,104 Z" fill="url(#gld-ribbon)"/>
  <path d="M78,90 L86,114 L70,104 Z" fill="url(#gld-ribbon)"/>
  <!-- Side Wings -->
  <path d="M18,36 L2,30 L10,54 L24,62 Z" fill="#FDE047"/>
  <path d="M102,36 L118,30 L110,54 L96,62 Z" fill="#FDE047"/>
  <path d="M22,48 L10,54 L20,70 L30,68 Z" fill="#CA8A04"/>
  <path d="M98,48 L110,54 L100,70 L90,68 Z" fill="#CA8A04"/>
  <!-- Outer Glow Frame -->
  <polygon points="60,8 104,32 104,84 60,108 16,84 16,32" fill="url(#gld-bevel)" filter="url(#gld-glow)"/>
  <!-- Main Hexagon Plate -->
  <polygon points="60,14 98,35 98,81 60,102 22,35" fill="url(#gld-base)"/>
  <!-- Inner Rim Highlight -->
  <polygon points="60,20 92,38 92,78 60,96 28,78 28,38" fill="none" stroke="#FEF08A" stroke-width="2" stroke-opacity="0.8"/>
  <!-- 3 Golden Stars -->
  <!-- Top Center Star -->
  <polygon points="60,30 64,40 75,40 66,47 69,57 60,51 51,57 54,47 45,40 56,40" fill="#FFFFFF"/>
  <!-- Bottom Left Star -->
  <polygon points="46,54 49,61 57,61 50,66 52,73 46,69 40,73 42,66 35,61 43,61" fill="#FEF08A"/>
  <!-- Bottom Right Star -->
  <polygon points="74,54 77,61 85,61 78,66 80,73 74,69 68,73 70,66 63,61 71,61" fill="#FEF08A"/>
  <!-- Bottom Accent -->
  <path d="M36,78 L60,92 L84,78 L84,83 L60,97 L36,83 Z" fill="#FEF08A"/>
</svg>
