<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="dia-base" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="30%" stop-color="#80DEEA"/>
      <stop offset="70%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <linearGradient id="dia-bevel" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="dia-wing" x1="0" y1="20" x2="120" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#80DEEA"/>
      <stop offset="100%" stop-color="#00ACC1"/>
    </linearGradient>
    <linearGradient id="dia-gem" x1="45" y1="35" x2="75" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B2EBF2"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <filter id="dia-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00E5FF" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- Triple Icy Crystal Wings -->
  <path d="M16,30 L0,18 L8,46 L24,56 Z" fill="url(#dia-wing)"/>
  <path d="M104,30 L120,18 L112,46 L96,56 Z" fill="url(#dia-wing)"/>
  <path d="M20,44 L6,46 L16,66 L30,66 Z" fill="#26C6DA"/>
  <path d="M100,44 L114,46 L104,66 L90,66 Z" fill="#26C6DA"/>
  <!-- Top Gem Crown/Tiara -->
  <polygon points="46,16 38,6 48,10 60,0 72,10 82,6 74,16" fill="#FFFFFF"/>
  <!-- Outer Glow Hexagon Bevel -->
  <polygon points="60,10 104,34 104,84 60,108 16,84 16,34" fill="url(#dia-bevel)" filter="url(#dia-glow)"/>
  <!-- Main Plate -->
  <polygon points="60,16 98,36 98,80 60,102 22,80 22,36" fill="url(#dia-base)"/>
  <!-- Inner Rim Highlight -->
  <polygon points="60,22 92,40 92,76 60,94 28,76 28,40" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9"/>
  <!-- Central Brilliant Diamond -->
  <polygon points="60,34 76,46 60,78 44,46" fill="url(#dia-gem)"/>
  <polygon points="60,34 76,46 44,46" fill="#FFFFFF" fill-opacity="0.8"/>
  <polygon points="60,34 60,78 44,46" fill="#80DEEA" fill-opacity="0.6"/>
  <!-- Sparkling Stars -->
  <polygon points="40,58 43,64 50,64 44,68 46,74 40,70 34,74 36,68 30,64 37,64" fill="#FFFFFF"/>
  <polygon points="80,58 83,64 90,64 84,68 86,74 80,70 74,74 76,68 70,64 77,64" fill="#FFFFFF"/>
  <!-- Bottom Chevron Highlight -->
  <path d="M36,78 L60,92 L84,78 L84,83 L60,97 L36,83 Z" fill="#E0F7FA"/>
</svg>
