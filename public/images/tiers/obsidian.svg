<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="obs-base" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="40%" stop-color="#18181B"/>
      <stop offset="80%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="obs-gold" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="obs-violet" x1="0" y1="20" x2="120" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="obs-crown" x1="40" y1="0" x2="80" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="obs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Grand Imperial Golden Wings -->
  <path d="M18,34 L2,20 L10,50 L26,62 Z" fill="url(#obs-gold)"/>
  <path d="M102,34 L118,20 L110,50 L94,62 Z" fill="url(#obs-gold)"/>
  <path d="M22,48 L8,50 L18,72 L32,70 Z" fill="url(#obs-violet)"/>
  <path d="M98,48 L112,50 L102,72 L88,70 Z" fill="url(#obs-violet)"/>
  <!-- Top Imperial Crown with Cross -->
  <path d="M44,18 L38,4 L50,10 L60,0 L70,10 L82,4 L76,18 Z" fill="url(#obs-crown)"/>
  <rect x="58" y="-4" width="4" height="10" rx="1" fill="#FEF08A"/>
  <rect x="55" y="-1" width="10" height="3" rx="1" fill="#FEF08A"/>
  <!-- Outer Glow Hexagon Bevel -->
  <polygon points="60,10 104,34 104,84 60,108 16,84 16,34" fill="url(#obs-gold)" filter="url(#obs-glow)"/>
  <!-- Main Obsidian Plate -->
  <polygon points="60,15 99,36 99,81 60,103 21,81 21,36" fill="url(#obs-base)"/>
  <!-- Neon Violet Inner Rim -->
  <polygon points="60,20 93,39 93,77 60,97 27,77 27,39" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-opacity="0.9"/>
  <!-- Central Crown Crest -->
  <path d="M48,46 L44,60 L76,60 L72,46 L66,52 L60,40 L54,52 Z" fill="url(#obs-crown)"/>
  <circle cx="60" cy="38" r="2.5" fill="#FEF08A"/>
  <circle cx="48" cy="44" r="2" fill="#FEF08A"/>
  <circle cx="72" cy="44" r="2" fill="#FEF08A"/>
  <!-- 5 Cosmic Gold Stars -->
  <polygon points="60,65 62,70 67,70 63,73 65,78 60,75 55,78 57,73 53,70 58,70" fill="#FEF08A"/>
  <polygon points="48,70 50,74 54,74 51,77 52,81 48,78 44,81 45,77 42,74 46,74" fill="#FBBF24"/>
  <polygon points="72,70 74,74 78,74 75,77 76,81 72,78 68,81 69,77 66,74 70,74" fill="#FBBF24"/>
  <!-- Bottom Golden Laurels / Chevron Accent -->
  <path d="M34,84 L60,99 L86,84 L86,90 L60,105 L34,90 Z" fill="url(#obs-gold)"/>
</svg>
