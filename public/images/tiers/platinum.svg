<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="plt-base" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#BAE6FD"/>
      <stop offset="70%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="plt-wing" x1="0" y1="20" x2="120" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="plt-crown" x1="40" y1="0" x2="80" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="plt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- Extended Crystal Wings -->
  <path d="M14,32 L0,22 L8,48 L22,58 Z" fill="url(#plt-wing)"/>
  <path d="M106,32 L120,22 L112,48 L98,58 Z" fill="url(#plt-wing)"/>
  <path d="M18,46 L4,48 L14,68 L28,68 Z" fill="#38BDF8"/>
  <path d="M102,46 L116,48 L106,68 L92,68 Z" fill="#38BDF8"/>
  <!-- Crown on Top -->
  <polygon points="46,18 42,6 52,12 60,2 68,12 78,6 74,18" fill="url(#plt-crown)"/>
  <!-- Outer Glow Hexagon -->
  <polygon points="60,14 102,36 102,86 60,110 18,86 18,36" fill="#F0F9FF" filter="url(#plt-glow)"/>
  <!-- Main Plate -->
  <polygon points="60,18 98,38 98,84 60,106 22,84 22,38" fill="url(#plt-base)"/>
  <!-- Inner Rim -->
  <polygon points="60,24 92,42 92,80 60,98 28,80 28,42" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9"/>
  <!-- Central Diamond Star -->
  <polygon points="60,34 67,49 84,49 71,59 76,75 60,65 44,75 49,59 36,49 53,49" fill="#FFFFFF"/>
  <circle cx="60" cy="56" r="3" fill="#38BDF8"/>
</svg>
