name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  code-style:
    name: Code Style (Pint, changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Pint on changed PHP files
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE_SHA"
          else
            BASE="origin/main"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.php' || true)
          if [ -z "$FILES" ]; then
            echo "No changed PHP files. Skipping Pint."
            exit 0
          fi
          echo "$FILES"
          vendor/bin/pint --test $FILES

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github --no-progress

  php-tests:
    name: PHP Tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, sqlite, pdo_sqlite, intl, gd, zip, bcmath
          coverage: none

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing --ansi

      - name: Run Pest
        run: vendor/bin/pest --parallel

  frontend:
    name: Frontend (TypeScript + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      # Ziggy types and JS are loaded from vendor/tightenco/ziggy.
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      # --ignore-scripts skips the Windows-only "prebuild" hook.
      # resources/js/translations.json is committed, so the build does not need it.
      - name: Build assets
        run: npm run build --ignore-scripts

  # The Docker E2E stack below depends on the removed tools/musoftware-runtime agent
  # and on Redis/Reverb, so it cannot pass today. It only runs on manual dispatch
  # and never blocks the pipeline.
  e2e-tests:
    name: Full E2E Docker Tests (manual, non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    needs: [static-analysis, php-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build and Start Testing Docker Environment
        run: docker compose -f docker-compose.testing.yml up -d --build

      - name: Wait for services to be ready
        timeout-minutes: 10
        run: |
          echo "Waiting for Laravel Backend..."
          until curl -s http://localhost:8001/api/runtime/version; do sleep 5; done

      - name: Setup Node.js for Runner
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Runner Dependencies
        run: cd tests/E2E/runner && npm install --no-audit --no-fund

      - name: Run E2E Workflow Tests
        run: cd tests/E2E/runner && npm test

      - name: Run Chaos Tests
        run: cd tests/E2E/runner && npm run test:chaos

      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker compose -f docker-compose.testing.yml logs
