name: E2E Testing Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github

  unit-feature-tests:
    name: Unit & Feature Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, sqlite, pdo_sqlite
          
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        
      - name: Run Pest PHP Tests
        run: php artisan test --parallel --recreate-databases
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Agent Dependencies
        run: cd tools/musoftware-runtime && npm ci
        
      - name: Run Agent Jest Tests
        run: cd tools/musoftware-runtime && npm test

  e2e-tests:
    name: Full E2E Docker Tests
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-feature-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build and Start Testing Docker Environment
        run: docker-compose -f docker-compose.testing.yml up -d --build
        
      - name: Wait for services to be ready
        run: |
          echo "Waiting for Laravel Backend..."
          until curl -s http://localhost:8001/api/runtime/version; do sleep 5; done
          echo "Waiting for Agent..."
          until curl -s http://localhost:18400/health; do sleep 5; done
          
      - name: Setup Node.js for Runner
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Runner Dependencies
        run: cd tests/E2E/runner && npm ci
        
      - name: Run E2E Workflow Tests
        run: cd tests/E2E/runner && npm test
        
      - name: Run Chaos Tests
        run: cd tests/E2E/runner && npm run test:chaos
        
      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker-compose -f docker-compose.testing.yml logs
